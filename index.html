<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>银盐 AgX</title>
<meta name="description" content="为 iPhone 17 相机准备的胶片色彩相机：富士、徕卡、理光、佳能、尼康、索尼、哈苏、柯达等 87 款色彩风格，按人像、风景、街拍等场景挑选。">
<meta name="theme-color" content="#101211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="银盐">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: one-screen camera. Viewfinder fills the top; scene pills, a brand dial row and a film strip of looks sit above the shutter bar. Desktop puts the controls in a right-hand column. */
:root{
  --body:#101211; --well:#060707; --panel:#1a1c1b; --raise:#252826; --line:#343836;
  --ink:#ece8df; --mute:#8f948f; --amber:#ffb340; --on-amber:#1c1404; --stamp:#ff7d1f;
  --paper:#f6f4ee; --paper-ink:#1d1d1b; --paper-mute:#7b7a74; --on-photo:#ffffff; --shade:rgba(0,0,0,.55);
  --f-dial:"DIN Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--body)}
body{height:100%;margin:0;overflow:hidden;background:var(--body);color:var(--ink);font:14px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

.app{height:100%;max-width:560px;margin:0 auto;display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto auto auto;
  grid-template-areas:"top" "vf" "scenes" "brands" "strip" "dock";
  gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 8px}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px}
.mark{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark b{font-size:18px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.mark span{font:700 11px/1 var(--f-dial);letter-spacing:.16em;color:var(--mute);white-space:nowrap}
.top-actions{display:flex;gap:6px;flex:none}
.tbtn{height:32px;min-width:32px;padding:0 11px;border-radius:16px;background:var(--raise);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn svg{width:17px;height:17px}
.tbtn.icon{padding:0;width:32px}
.tbtn[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}

/* viewfinder */
.vf{grid-area:vf;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;border-radius:6px;background:var(--well);overflow:hidden}
.shot{position:relative;flex:none}
.shot.framed{background:var(--paper)}
.img{position:relative;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:grab}
#view{display:block;width:100%;height:100%;-webkit-touch-callout:none}
.readout{position:absolute;left:10px;top:9px;right:64px;display:flex;flex-direction:column;gap:3px;pointer-events:none;text-shadow:0 1px 8px var(--shade)}
.readout b{font:700 12px/1 var(--f-dial);letter-spacing:.18em;color:var(--amber)}
.readout span{font:700 19px/1 var(--f-dial);letter-spacing:.05em;color:var(--on-photo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-ratio{position:absolute;right:10px;top:9px;font-size:11px;color:var(--on-photo);opacity:.85;text-shadow:0 1px 6px var(--shade);pointer-events:none}
.stamp{position:absolute;pointer-events:none;color:var(--stamp);font-family:var(--f-dial);font-weight:700;letter-spacing:.08em;white-space:nowrap;text-shadow:0 0 .35em var(--stamp)}
.badge{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:4px 10px;border-radius:12px;background:var(--shade);color:var(--on-photo);font-size:12px;pointer-events:none}
.pill{position:absolute;left:50%;top:10px;transform:translateX(-50%);height:30px;padding:0 14px;border-radius:15px;background:var(--shade);color:var(--on-photo);font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.caption{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(to top,var(--shade),transparent);color:var(--on-photo);font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .35s}
.caption.show{opacity:1}
.caption b{font-weight:600;margin-right:6px}
.lenses{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;padding:4px;border-radius:20px;background:var(--shade);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lenses button{width:32px;height:32px;border-radius:50%;font:700 12px/1 var(--f-mono);color:var(--on-photo)}
.lenses button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.framebar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;color:var(--paper-ink);pointer-events:none}
.framebar div{display:flex;flex-direction:column;gap:.25em;min-width:0}
.framebar .fb-r{text-align:right;align-items:flex-end}
.framebar b{font-family:var(--f-dial);font-weight:700;letter-spacing:.06em;line-height:1}
.framebar span{color:var(--paper-mute);line-height:1;white-space:nowrap}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:var(--shade);color:var(--on-photo);font-size:13px;z-index:3}
.flash{position:absolute;inset:0;background:var(--on-photo);opacity:0;pointer-events:none}
.flash.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.vf-msg{padding:24px;text-align:center;color:var(--mute);max-width:32ch}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}

/* chips */
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.scenes{grid-area:scenes}
.scenes button{flex:none;height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--line);color:var(--mute);font-size:13px}
.scenes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--body)}
.brands{grid-area:brands;gap:16px;border-bottom:1px solid var(--line)}
.brands button{flex:none;padding:4px 0 7px;font-size:13px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:baseline;gap:3px}
.brands button small{font:500 10px/1 var(--f-mono);color:var(--mute);opacity:.8}
.brands button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.brands button.dim{opacity:.38}

/* film strip of looks */
.strip{grid-area:strip;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:112px;align-items:flex-start}
.look{flex:none;width:60px;display:flex;flex-direction:column;gap:4px;text-align:left}
.look canvas{width:60px;height:80px;border-radius:4px;background:var(--raise);display:block}
.look .lb{font:700 9px/1 var(--f-dial);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look .ln{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look[aria-pressed="true"] canvas{box-shadow:0 0 0 2px var(--amber)}
.look[aria-pressed="true"] .ln{color:var(--amber)}
.empty{margin:0;padding:12px 2px;color:var(--mute);font-size:13px}

/* dock */
.dock{grid-area:dock;display:flex;flex-direction:column;gap:4px}
.strength{display:grid;grid-template-columns:auto minmax(0,1fr) 30px;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.strength output{text-align:right;color:var(--ink);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;margin:0;background:transparent;--p:100%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(to right,var(--amber) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-8px;border-radius:50%;background:var(--ink);box-shadow:0 1px 4px var(--shade)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--ink)}
.shutter-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:66px}
.side{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;font-size:11px;color:var(--mute)}
.side svg{width:26px;height:26px;color:var(--ink)}
.shutter{width:66px;height:66px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center}
.shutter span{width:52px;height:52px;border-radius:50%;background:var(--ink);transition:transform .12s}
.shutter:active span{transform:scale(.88)}
.shutter.live span{background:var(--on-photo)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--shade)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:14px 14px 0 0;
  padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet h2{margin:0;font-size:16px;font-weight:600}
.sheet header button{color:var(--amber);font-size:15px;padding:6px 0 6px 12px}
.set{display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:50px;border-top:1px solid var(--line)}
.set-row>span{display:flex;flex-direction:column;gap:2px;flex:none}
.set-row small{font-size:11px;color:var(--mute)}
.set-row input[type=range]{max-width:200px}
.set-row output{width:44px;text-align:right;font-size:12px;color:var(--mute)}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button{height:30px;padding:0 10px;border-radius:8px;background:var(--raise);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--amber);color:var(--on-amber)}
.switch{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;margin:0;transition:background .2s;cursor:pointer}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch:checked{background:var(--amber)}
.switch:checked::after{transform:translateX(18px)}
.note{margin:12px 0 0;font-size:11.5px;line-height:1.6;color:var(--mute)}
.save-img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:4px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.save-meta{margin:10px 0 2px;text-align:center;font-size:11px;color:var(--mute)}
.hint{margin:0 0 12px;text-align:center;font-size:13px}
.save-actions{display:flex;gap:8px}
.save-actions button{flex:1;height:44px;border-radius:10px;background:var(--raise);font-size:15px}
.save-actions .primary{background:var(--amber);color:var(--on-amber);font-weight:600}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,440px);padding:10px 14px;border-radius:12px;background:var(--raise);color:var(--ink);font-size:13px;line-height:1.5;box-shadow:0 8px 30px var(--shade)}

@media (min-width:900px){
  .app{max-width:1280px;grid-template-columns:minmax(0,1fr) 400px;column-gap:24px;
    grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"top top" "vf scenes" "vf brands" "vf strip" "vf dock";padding-block:10px 14px}
  .scenes,.brands{flex-wrap:wrap;overflow:visible}
  .brands{row-gap:4px}
  .strip{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;align-content:flex-start;gap:12px 10px;min-height:0}
  .look{width:68px}
  .look canvas{width:68px;height:90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="mark"><b>银盐</b><span>AgX · FOR iPHONE 17</span></div>
    <div class="top-actions">
      <button class="tbtn" id="btnLive" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.4-2h6.8l1.4 2h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>实时</button>
      <button class="tbtn mono" id="btnRatio" aria-label="切换画幅">4:3</button>
      <button class="tbtn icon" id="btnSettings" aria-label="拍摄设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <section class="vf" id="vf" aria-label="取景器">
    <div class="shot" id="shot">
      <div class="img" id="imgBox">
        <canvas id="view"></canvas>
        <div class="readout"><b id="roBrand"></b><span id="roName"></span></div>
        <span class="ro-ratio mono" id="roRatio"></span>
        <span class="stamp" id="stamp" hidden></span>
        <span class="badge" id="badgeCompare" hidden>原图</span>
        <button class="pill" id="btnBackLive" hidden>返回取景</button>
        <div class="caption" id="caption"></div>
        <div class="lenses" id="lenses" hidden></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="framebar" id="framebar" hidden>
        <div><b id="fbBrand"></b><span id="fbLook"></span></div>
        <div class="fb-r"><b>SHOT ON iPHONE</b><span class="mono" id="fbDate"></span></div>
      </div>
    </div>
    <div class="busy" id="busy" hidden>正在处理…</div>
    <video id="video" playsinline muted autoplay></video>
  </section>

  <nav class="row scenes" id="scenes" aria-label="拍摄场景"></nav>
  <nav class="row brands" id="brands" aria-label="相机品牌"></nav>
  <div class="strip" id="strip" aria-label="滤镜"></div>

  <div class="dock">
    <label class="strength" for="intensity"><span>强度</span><input id="intensity" type="range" min="0" max="100" value="100"><output id="intensityOut" class="mono">100</output></label>
    <div class="shutter-row">
      <button class="side" id="btnAlbum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.6"/></svg><span>相册</span></button>
      <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>
      <button class="side" id="btnRight"><svg id="icoRight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></svg><span id="lblRight">保存</span></button>
    </div>
  </div>
</div>

<input type="file" id="fileCamera" class="vh" accept="image/*" capture="environment" tabindex="-1">
<input type="file" id="fileAlbum" class="vh" accept="image/*" tabindex="-1">

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheetSettings" role="dialog" aria-label="拍摄设置" hidden>
  <header><h2>拍摄设置</h2><button data-close>完成</button></header>
  <div class="set">
    <div class="set-row"><span>画幅</span><div class="seg" id="segRatio"></div></div>
    <label class="set-row" for="grainMul"><span>颗粒<small>滤镜自带颗粒的倍数</small></span><input type="range" id="grainMul" min="0" max="200" value="100"><output class="mono" id="grainOut">100%</output></label>
    <label class="set-row" for="vigMul"><span>暗角<small>滤镜自带暗角的倍数</small></span><input type="range" id="vigMul" min="0" max="200" value="100"><output class="mono" id="vigOut">100%</output></label>
    <label class="set-row" for="optStamp"><span>日期水印<small>胶片机式橙色日期</small></span><input type="checkbox" class="switch" id="optStamp"></label>
    <label class="set-row" for="optFrame"><span>白边相框<small>底部印上品牌与滤镜名</small></span><input type="checkbox" class="switch" id="optFrame"></label>
    <div class="set-row"><span>输出尺寸</span><div class="seg" id="segSize"><button data-v="12">1200 万像素</button><button data-v="16">1600 万像素</button></div></div>
  </div>
  <p class="note" id="noteDevice"></p>
  <p class="note">滤镜参考各品牌公开的色彩风格调校而成，并非官方出品。按住画面可对比原图，左右滑动画面可切换滤镜。</p>
</section>
<section class="sheet" id="sheetSave" role="dialog" aria-label="保存照片" hidden>
  <header><h2>照片已生成</h2><button data-close>关闭</button></header>
  <img class="save-img" id="saveImg" alt="套用滤镜后的照片">
  <p class="save-meta mono" id="saveMeta"></p>
  <p class="hint">长按图片，选择「存储到照片」即可存入相册</p>
  <div class="save-actions"><button class="primary" id="btnDoSave">保存图片</button><button id="btnShare" hidden>分享…</button></div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- scenes, brands, looks ---------- */
const SCENES = [
  {id:'all', n:'全部'},
  {id:'portrait', n:'人像', tip:'建议 2× 镜头（17 Pro 可用 4×），侧逆光、背景留暗更出效果'},
  {id:'landscape', n:'风景', tip:'建议 0.5× 超广角或 1× 主摄，蓝天绿地用正片类滤镜最出彩'},
  {id:'street', n:'街拍', tip:'建议 1× 或 2×，硬调彩色与黑白最有故事感'},
  {id:'night', n:'夜景', tip:'建议 1× 主摄（进光最多）并保持稳定，霓虹灯下试试 CineStill 800T'},
  {id:'food', n:'美食', tip:'建议 2× 俯拍或 45° 斜拍，高饱和暖调让食物更诱人'},
  {id:'arch', n:'建筑', tip:'0.5× 拍全貌、2× 拍细节，局部反差类滤镜能强化线条'},
  {id:'daily', n:'日常', tip:'1× 随手拍，胶卷类滤镜自带生活氛围'},
  {id:'bw', n:'黑白', tip:'光影分明、反差大的场景最适合黑白'}
];
const BRANDS = [
  {id:'all', n:'全部'},
  {id:'fuji', n:'富士', en:'FUJIFILM'}, {id:'leica', n:'徕卡', en:'LEICA'}, {id:'ricoh', n:'理光', en:'RICOH GR'},
  {id:'pentax', n:'宾得', en:'PENTAX'}, {id:'canon', n:'佳能', en:'CANON'}, {id:'nikon', n:'尼康', en:'NIKON'},
  {id:'sony', n:'索尼', en:'SONY'}, {id:'hassel', n:'哈苏', en:'HASSELBLAD'}, {id:'olympus', n:'奥林巴斯', en:'OLYMPUS'},
  {id:'lumix', n:'松下', en:'LUMIX'}, {id:'kodak', n:'柯达', en:'KODAK'}, {id:'film', n:'经典胶片', en:'FILM'}

const SRC_CAP = 16e6;

  try {
    const img = new Image(); img.src = url; await img.decode();
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    const k = Math.min(1, Math.sqrt(SRC_CAP / (w0 * h0)));

  if (S.scene !== 'all') list = list.slice().sort((a, b) => (a.id === 'none' ? -1 : b.id === 'none' ? 1 : a.sc.indexOf(S.scene) - b.sc.indexOf(S.scene)));

}

function setRatio(r){ S.ratio = r; syncRatio(); layout(); savePrefs(); }
$('#btnRatio').addEventListener('click', () => setRatio(RATIO_KEYS[(RATIO_KEYS.indexOf(S.ratio) + 1) % RATIO_KEYS.length]));
$('#segRatio').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setRatio(b.dataset.v); });
function bindMul(id, outId, key){
  const el = $(id); el.value = Math.round(S[key] * 100); $(outId).textContent = el.value + '%'; setRangeFill(el);
  el.addEventListener('input', () => { S[key] = el.value / 100; $(outId).textContent = el.value + '%'; setRangeFill(el); requestRender(); });
  el.addEventListener('change', savePrefs);
}
bindMul('#grainMul', '#grainOut', 'grainMul'); bindMul('#vigMul', '#vigOut', 'vigMul');
$('#optStamp').checked = S.stamp; $('#optFrame').checked = S.frame;
$('#optStamp').addEventListener('change', e => { S.stamp = e.target.checked; updateReadout(); savePrefs(); });
$('#optFrame').addEventListener('change', e => { S.frame = e.target.checked; layout(); savePrefs(); });
function syncSize(){ $('#segSize').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === S.size)); }
$('#segSize').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.size = +b.dataset.v; syncSize(); savePrefs(); } });
$('#noteDevice').textContent = `为 iPhone 17 系列调校：0.5× / 1× / 2×，17 Pro 另有 4× / 8×。48MP 照片会按 Safari 画布上限缩放到 1600 万像素以内${main.p3 ? '，并保留 Display P3 广色域' : ''}。`;

let openSheetEl = null;
function openSheet(el){ openSheetEl = el; $('#scrim').hidden = false; el.hidden = false; }
function closeSheet(){
  if (!openSheetEl) return;
  openSheetEl.hidden = true; $('#scrim').hidden = true;
  if (openSheetEl.id === 'sheetSave') { const img = $('#saveImg'); if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.removeAttribute('src'); lastExport = null; }
  openSheetEl = null;
}
$('#btnSettings').addEventListener('click', () => openSheet($('#sheetSettings')));
$('#scrim').addEventListener('click', closeSheet);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));

/* ---------- live viewfinder (works where the page may use the camera: Safari / home-screen app over HTTPS) ---------- */
let stream = null, lensDevs = {}, curDeviceId = null, thumbTimer = 0, liveBlocked = false;
const LENSES = [
  {k:'ultra', label:'.5', dev:'ultra', zoom:1}, {k:'wide', label:'1×', dev:'wide', zoom:1}, {k:'wide2', label:'2', dev:'wide', zoom:2},
  {k:'tele', label:'4', dev:'tele', zoom:1}, {k:'tele2', label:'8', dev:'tele', zoom:2}
];
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) $('#btnLive').hidden = false;
function stopLive(){
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  clearInterval(thumbTimer); thumbTimer = 0;
  if (S.mode === 'live') S.mode = 'photo';
  $('#lenses').hidden = true;
}
async function startLive(deviceId, zoom = 1){
  if (liveBlocked) return;
  busy(true, '正在打开相机…');
  try {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const size = {width:{ideal:4032}, height:{ideal:3024}};
    const video_c = deviceId ? Object.assign({deviceId:{exact:deviceId}}, size) : Object.assign({facingMode:{ideal:S.facing}}, size);
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:video_c});
    video.srcObject = stream;
    await video.play().catch(() => {});
    const st = stream.getVideoTracks()[0].getSettings();
    curDeviceId = st.deviceId || deviceId || null;
    if (st.facingMode) S.facing = st.facingMode === 'user' ? 'user' : 'environment';
    S.mode = 'live'; S.fromLive = true; S.zoom = zoom; S.shotDate = new Date();
    await detectLenses();
    clearInterval(thumbTimer);
    thumbTimer = setInterval(() => { if (S.mode === 'live' && video.videoWidth) snapshotThumbs(video, video.videoWidth, video.videoHeight, S.facing === 'user'); }, 2500);
    liveLoop();
    updateControls(); updateReadout();
    setTimeout(() => { if (S.mode === 'live' && video.videoWidth) snapshotThumbs(video, video.videoWidth, video.videoHeight, S.facing === 'user'); }, 400);
  } catch (e) {
    console.warn(e);
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      liveBlocked = !!inArtifact;
      toast(inArtifact
        ? '在 claude.ai 里打开时网页不能直接调用摄像头。点快门会打开 iPhone 系统相机拍照；添加到主屏幕的离线版可以实时取景。'
        : '没有拿到相机权限。请到 设置 › Safari › 相机 允许访问，或点快门用系统相机拍照。', 6000);
      if (liveBlocked) $('#btnLive').hidden = true;
    } else {
      toast('相机打开失败：' + (e && e.message ? e.message : '未知错误') + '。可以先点快门用系统相机拍照。', 5000);
    }
    stopLive(); updateControls();
  } finally { busy(false); }
}
async function detectLenses(){
  lensDevs = {};
  try {
    const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    for (const d of ds) {
      const l = (d.label || '').toLowerCase();
      if (/front|前置|facetime|user/.test(l)) lensDevs.front = lensDevs.front || d.deviceId;
      else if (/ultra|超广角/.test(l)) lensDevs.ultra = lensDevs.ultra || d.deviceId;
      else if (/tele|长焦/.test(l)) lensDevs.tele = lensDevs.tele || d.deviceId;
      else if (/dual|triple|双|三/.test(l)) continue;
      else if (/back|rear|后置|后|camera|相机/.test(l)) lensDevs.wide = lensDevs.wide || d.deviceId;
    }
  } catch (e) {}
  if (S.facing === 'environment' && curDeviceId) {
    const k = Object.keys(lensDevs).find(k => lensDevs[k] === curDeviceId);
    if (!k) lensDevs.wide = lensDevs.wide || curDeviceId;
    const devKey = k || 'wide';
    S.lensKey = LENSES.find(o => o.dev === devKey && o.zoom === S.zoom)?.k || devKey;
  }
  renderLenses();
}
function renderLenses(){
  const box = $('#lenses');
  if (S.mode !== 'live' || S.facing === 'user') { box.hidden = true; return; }
  const opts = LENSES.filter(o => lensDevs[o.dev]);
  box.innerHTML = opts.map(o => `<button data-lens="${o.k}" aria-pressed="${o.k === S.lensKey}" aria-label="${o.label.replace('.5', '0.5')}× 镜头">${o.k === S.lensKey ? (o.label.endsWith('×') ? o.label : o.label + '×') : o.label}</button>`).join('');
  box.hidden = opts.length < 2;
}
$('#lenses').addEventListener('click', async e => {
  const b = e.target.closest('[data-lens]'); if (!b) return;
  const o = LENSES.find(x => x.k === b.dataset.lens), id = lensDevs[o.dev];
  S.lensKey = o.k;
  if (id && id !== curDeviceId) await startLive(id, o.zoom);
  else { S.zoom = o.zoom; renderLenses(); layout(); }
});
function liveLoop(){
  if (S.mode !== 'live') return;
  if (video.readyState >= 2 && video.videoWidth) {
    if (video.videoWidth !== S.srcW || video.videoHeight !== S.srcH) { S.srcW = video.videoWidth; S.srcH = video.videoHeight; main.upload(video, S.srcW, S.srcH); layout(); }
    else main.upload(video, S.srcW, S.srcH);
    renderMain();
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(liveLoop); else requestAnimationFrame(liveLoop);
}
function capture(){
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const zw = vw / S.zoom, zh = vh / S.zoom;
  srcCanvas.width = Math.round(zw); srcCanvas.height = Math.round(zh);
  srcCtx.save();
  if (S.facing === 'user') { srcCtx.translate(srcCanvas.width, 0); srcCtx.scale(-1, 1); }
  srcCtx.drawImage(video, (vw - zw) / 2, (vh - zh) / 2, zw, zh, 0, 0, srcCanvas.width, srcCanvas.height);
  srcCtx.restore();
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  stopLive(); S.mode = 'photo'; S.zoom = 1; S.shotDate = new Date();
  setSourceFromCanvas(); updateReadout();
}
$('#btnLive').addEventListener('click', () => { if (S.mode === 'live') { stopLive(); S.fromLive = false; paintOrKeep(); } else startLive(); });
$('#btnBackLive').addEventListener('click', () => startLive(curDeviceId, S.lensKey.endsWith('2') ? 2 : 1));
function paintOrKeep(){ if (S.mode !== 'photo') paintSample(); else { main.upload(srcCanvas, S.srcW = srcCanvas.width, S.srcH = srcCanvas.height); layout(); } updateControls(); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.mode === 'live' && (!stream || stream.getVideoTracks()[0].readyState === 'ended')) startLive(curDeviceId, S.zoom);
});

/* ---------- controls ---------- */
const ICON_SAVE = '<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 15v3.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V15"/>';
const ICON_FLIP = '<path d="M4 9a8 8 0 0 1 14.5-3.5L20 7"/><path d="M20 3v4h-4"/><path d="M20 15a8 8 0 0 1-14.5 3.5L4 17"/><path d="M4 21v-4h4"/>';
function updateControls(){
  const live = S.mode === 'live';
  $('#btnLive').setAttribute('aria-pressed', live);
  $('#btnShutter').classList.toggle('live', live);
  $('#btnShutter').setAttribute('aria-label', live ? '拍照' : (S.fromLive ? '返回取景' : '打开系统相机拍照'));
  $('#icoRight').innerHTML = live ? ICON_FLIP : ICON_SAVE;
  $('#lblRight').textContent = live ? '翻转' : '保存';
  $('#btnBackLive').hidden = !(S.mode === 'photo' && S.fromLive && !liveBlocked);
  renderLenses();
}
$('#btnShutter').addEventListener('click', () => {
  if (S.mode === 'live') return capture();
  if (S.fromLive && !liveBlocked) return startLive(curDeviceId, S.lensKey.endsWith('2') ? 2 : 1);
  $('#fileCamera').click();
});
$('#btnAlbum').addEventListener('click', () => $('#fileAlbum').click());
$('#fileCamera').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('#fileAlbum').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
$('#btnRight').addEventListener('click', () => {
  if (S.mode === 'live') { S.facing = S.facing === 'user' ? 'environment' : 'user'; S.zoom = 1; S.lensKey = 'wide'; startLive(S.facing === 'user' ? lensDevs.front : lensDevs.wide, 1); }
  else save();
});

/* ---------- export ---------- */
let lastExport = null;
function drawStamp(ctx, x, y, w, h){
  const fs = Math.round(h * .042);
  ctx.save();
  ctx.font = `700 ${fs}px ${DIAL}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ff7d1f'; ctx.shadowColor = 'rgba(255,110,20,.9)'; ctx.shadowBlur = fs * .35;
  ctx.fillText(stampText(S.shotDate).replace(/ /g, ' '), x + w - w * .05, y + h - h * .045);
  ctx.restore();
}
function drawFrameText(ctx, x, y, w, bb){
  const L = curLook(), cy = y + bb / 2;
  ctx.save(); ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1d1d1b'; ctx.font = `700 ${bb * .26}px ${DIAL}`; ctx.textAlign = 'left';
  ctx.fillText(L.b ? brandEn(L) : 'AgX 银盐', x, cy - bb * .12);
  ctx.fillStyle = '#7b7a74'; ctx.font = `500 ${bb * .15}px ${UI}`;
  ctx.fillText(L.id === 'none' ? '原图' : `${L.en}${L.n !== L.en ? ' · ' + L.n : ''}`, x, cy + bb * .2);
  ctx.textAlign = 'right'; ctx.fillStyle = '#1d1d1b'; ctx.font = `700 ${bb * .17}px ${DIAL}`;
  ctx.fillText('SHOT ON iPHONE', x + w, cy - bb * .12);
  ctx.fillStyle = '#7b7a74'; ctx.font = `500 ${bb * .15}px ${MONO}`;
  ctx.fillText(dateText(S.shotDate), x + w, cy + bb * .2);
  ctx.restore();
}
async function exportImage(){
  const L = curLook(), cr = cropRect(S.srcW, S.srcH, S.ratio, 1);
  const cw = cr[2] * S.srcW, ch = cr[3] * S.srcH, cap = S.size === 16 ? 16e6 : 12.2e6;
  if (!exportR) exportR = new Renderer(document.createElement('canvas'), true);
  const k = Math.min(1, Math.sqrt(cap / (cw * ch)), exportR.maxDim / Math.max(cw, ch));
  const w = Math.round(cw * k), h = Math.round(ch * k);
  exportR.canvas.width = w; exportR.canvas.height = h;
  exportR.upload(srcCanvas, S.srcW, S.srcH);
  exportR.draw(resolved(L), {crop:cr, flip:false, amt:L.id === 'none' ? 0 : S.intensity, w, h, grainMul:S.grainMul, vigMul:S.vigMul});
  let out = exportR.canvas;
  if (S.stamp || S.frame) {
    const m = Math.min(w, h), p = S.frame ? Math.round(FR.side * m) : 0, bb = S.frame ? Math.round(FR.bottom * m) : 0;
    const comp = document.createElement('canvas'); comp.width = w + 2 * p; comp.height = h + p + bb;
    const ctx = comp.getContext('2d', ctxOpts) || comp.getContext('2d');
    if (S.frame) { ctx.fillStyle = '#f6f4ee'; ctx.fillRect(0, 0, comp.width, comp.height); }
    ctx.drawImage(exportR.canvas, p, p);
    if (S.stamp) drawStamp(ctx, p, p, w, h);
    if (S.frame) drawFrameText(ctx, p, p + h, w, bb);
    out = comp;
  }
  const blob = await new Promise((res, rej) => out.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', .95));
  const dims = [out.width, out.height];
  exportR.release(); exportR.canvas.width = 1; exportR.canvas.height = 1;
  if (out !== exportR.canvas) { out.width = 1; out.height = 1; }
  return {blob, w:dims[0], h:dims[1]};
}
async function save(){
  if (!$('#busy').hidden) return;
  busy(true, '正在输出照片…');
  await new Promise(r => setTimeout(r, 40));
  try {
    const r = await exportImage(), L = curLook(), d = S.shotDate;
    const name = `agx_${L.id}_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
    lastExport = {blob:r.blob, name};
    const img = $('#saveImg'); if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(r.blob);
    $('#saveMeta').textContent = `${r.w} × ${r.h} · ${(r.blob.size / 1048576).toFixed(1)} MB · ${L.b ? brandEn(L) + ' ' : ''}${L.en}`;
    const dl = await capDownloads;
    let file = null; try { file = new File([r.blob], name, {type:'image/jpeg'}); } catch (e) {}
    const canShare = !inArtifact && file && navigator.canShare && navigator.canShare({files:[file]});
    $('#btnShare').hidden = !canShare;
    $('#btnDoSave').hidden = inArtifact && !dl;
    $('#btnDoSave').textContent = inArtifact ? '保存图片' : (canShare ? '存储到照片…' : '下载图片');
    openSheet($('#sheetSave'));
  } catch (e) {
    console.error(e); toast('输出失败，可以在设置里改成 1200 万像素再试');
  } finally { busy(false); }
}
async function shareFile(){
  const f = new File([lastExport.blob], lastExport.name, {type:'image/jpeg'});
  try { await navigator.share({files:[f], title:'AgX 银盐'}); } catch (e) { if (e.name !== 'AbortError') toast('分享没有完成，可以长按图片保存'); }
}
$('#btnDoSave').addEventListener('click', async () => {
  if (!lastExport) return;
  if (inArtifact) {
    const dl = await capDownloads; if (!dl) return;
    try { await dl.save({filename:lastExport.name, data:lastExport.blob}); toast('已保存'); }
    catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? '上一个保存还没完成，请稍等' : '这里不能直接保存，请长按图片选择「存储到照片」'); }
    return;
  }
  if (!$('#btnShare').hidden) return shareFile();
  const a = document.createElement('a'); a.href = $('#saveImg').src; a.download = lastExport.name; document.body.append(a); a.click(); a.remove();
});
$('#btnShare').addEventListener('click', () => lastExport && shareFile());

/* ---------- boot ---------- */
renderScenes(); renderBrands(); renderStrip(); syncRatio(); syncSize();
paintSample();
selectLook(S.look, {quiet:true, keepRatio:true});
updateReadout(); updateControls();
caption(`<b>示例画面</b>点快门用 iPhone 相机拍一张，或从相册选择照片；按住画面对比原图`);
const standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
if (!inArtifact && !standalone && 'serviceWorker' in navigator) {
  let seen = false; try { seen = !!localStorage.getItem(PREF_KEY + '.a2hs'); localStorage.setItem(PREF_KEY + '.a2hs', '1'); } catch (e) {}
  if (!seen) setTimeout(() => toast('在 Safari 点「分享 › 添加到主屏幕」，之后没网也能打开', 6000), 1500);
}
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
